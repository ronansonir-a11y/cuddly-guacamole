name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NochnoyDvor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NochnoyDvor-apk
          path: NochnoyDvor.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest NochnoyDvor.apk \
            --title "Ночной двор — APK" \
            --notes "Свежая сборка из ${GITHUB_SHA::7}. Скачай NochnoyDvor.apk, разреши установку из неизвестных источников и запускай." \
            --target "$GITHUB_SHA"
