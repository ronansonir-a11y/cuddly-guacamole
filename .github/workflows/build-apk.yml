name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # На ubuntu-latest Android SDK уже стоит (ANDROID_HOME); отдельный setup-android не нужен.
      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NochnoyDvor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NochnoyDvor-apk
          path: NochnoyDvor.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest NochnoyDvor.apk \
            --title "Ночной двор — APK" \
            --notes "Свежая сборка из ${GITHUB_SHA::7}. Скачай NochnoyDvor.apk, разреши установку из неизвестных источников и запускай." \
            --target "$GITHUB_SHA"
